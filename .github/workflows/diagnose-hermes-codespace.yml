name: cp-inspect-2
on:
  workflow_dispatch:
jobs:
  inspect2:
    runs-on: ubuntu-latest
    steps:
      - name: Architecture inspection round 2 (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          R=/home/codespace/.hermes/hermes-agent
          echo "===== A) telegram plugin dir ====="
          wc -l "$R/plugins/platforms/telegram/"*.py 2>/dev/null | head -30
          echo "===== B) gateway/platforms dir ====="
          ls "$R/gateway/platforms/"
          echo "===== C) function index: telegram plugin entry ====="
          for f in "$R/plugins/platforms/telegram/"*.py; do
            echo "--- $(basename "$f"):"
            grep -nE '^(class |def |async def |    async def |    def )' "$f" | head -12
          done 2>/dev/null | head -120
          echo "===== D) i18n languages ====="
          grep -nE '(SUPPORTED|LANGS|LOCALES|"fa|"en|"ar|"es|"zh|fa_IR)' "$R/agent/i18n.py" | head -20
          echo "===== E) managed bot ====="
          grep -nE '^(class |def |async def )' "$R/hermes_cli/telegram_managed_bot.py" | head -25
          echo "--- what calls managed bot:"
          grep -rln 'telegram_managed_bot' "$R" --include='*.py' --exclude-dir=venv --exclude-dir=.venv | grep -v tests | head -5
          echo "===== F) pairing store + module ====="
          ls /home/codespace/.hermes/pairing/ 2>/dev/null
          find "$R/gateway" -iname '*pair*' -name '*.py' | head -5
          echo "===== G) config.yaml top-level keys ====="
          grep -oE '^[a-zA-Z_]+:' /home/codespace/.hermes/config.yaml | head -25
          echo "===== H) existing slash commands in telegram plugin ====="
          grep -rnoE '"/[a-z_]+"' "$R/plugins/platforms/telegram/" 2>/dev/null | sort -t: -k2 -u | head -40 || echo none-found-here
          grep -rln 'def _cmd_model\|handle_model\|model_picker' "$R/plugins" "$R/gateway" --include='*.py' 2>/dev/null | grep -v tests | head -8
          REMOTE
          echo "===== INSPECT2=DONE ====="
