name: hardening-audit
on:
  workflow_dispatch:

permissions: {}

env:
  CODESPACE_NAME: crispy-space-cod-jrqqwq797j6vcwqw

jobs:
  audit:
    name: Phase-1 hardening audit (READ-ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Secret presence (never printed)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          echo "GH_TOKEN present"

      - name: Runner-side gh capability probe (read-only --help)
        run: |
          echo "--- gh codespace edit --help ---"
          gh codespace edit --help 2>&1 | head -40 || echo "no edit subcommand"

      - name: Codespace state + settings (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          gh api "/user/codespaces/${CODESPACE_NAME}" --jq '{state,idle_timeout_minutes,machine:.machine.name,location,updated_at}'

      - name: In-codespace audit (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -uo pipefail
          H="$HOME/.hermes"
          export PATH="$H/bin:$PATH"
          echo "===== H1) hermes process check ====="
          pgrep -af "hermes" | grep -vi pgrep | head -5 | cut -c1-120 || echo "no hermes process running"
          echo "===== H2) gateway state dir ====="
          ls -la "$H/state" 2>/dev/null | head -10 || echo "state dir missing"
          echo "sentinel: $(cat "$H/state/gateway.lifecycle.json" 2>/dev/null || echo absent)"
          echo "===== H3) effective config (redacted) ====="
          echo "model.provider = $(hermes config get model.provider 2>/dev/null)"
          echo "model.default  = $(hermes config get model.default 2>/dev/null)"
          echo "GEMINI_API_KEY: $(awk -F= '$1=="GEMINI_API_KEY"{print (length($2)>5)?"PRESENT":"EMPTY"}' "$H/.env" 2>/dev/null)"
          echo "TELEGRAM_BOT_TOKEN: $(awk -F= '$1=="TELEGRAM_BOT_TOKEN"{print (length($2)>20)?"PRESENT":"EMPTY"}' "$H/.env" 2>/dev/null)"
          echo "===== H4) supervisors ====="
          (systemctl --user list-units 2>/dev/null | grep -i hermes | head -3) || echo "no user systemd hermes units"
          command -v tmux >/dev/null && echo "tmux EXISTS" || echo "no tmux"
          command -v crontab >/dev/null && crontab -l 2>/dev/null | grep -v '^#' | head -3 || echo "no crontab"
          echo "===== H5) repo working tree ====="
          git -C /workspaces/hermes-agent- rev-parse --abbrev-ref HEAD 2>/dev/null
          git -C /workspaces/hermes-agent- status --porcelain 2>/dev/null | head -10 | cut -c1-100
          echo "porcelain lines: $(git -C /workspaces/hermes-agent- status --porcelain 2>/dev/null | wc -l)"
          echo "===== H6) hermes version ====="
          hermes --version 2>&1 | head -1
          echo "AUDIT_DONE"
          REMOTE
