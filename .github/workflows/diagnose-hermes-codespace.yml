name: migration-phase9-retry
on:
  workflow_dispatch:

permissions: {}

env:
  NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v

jobs:
  phase9:
    name: upstream-label forensics + bounded real-request retry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gate
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          st=$(gh api "/user/codespaces/${NEW_CS}" --jq .state); echo "NEW state: $st"
          [ "$st" = "Available" ] || { echo "::error::NEW not Available"; exit 1; }

      - name: Forensics + bounded retry
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -uo pipefail
          H="$HOME/.hermes"; SRC="$H/hermes-agent"
          export PATH="$HOME/.local/bin:$PATH"

          echo "===== F1) upstream label provenance ====="
          echo "git HEAD: $(git -C "$SRC" rev-parse HEAD 2>/dev/null)"
          grep -rn "upstream" "$SRC/hermes_cli/version.py" 2>/dev/null | head -6 | cut -c1-170
          grep -rln "upstream" "$SRC/hermes_cli" 2>/dev/null | head -6 | sed "s|$SRC|<src>|"
          grep -rn "416a8177\|_UPSTREAM\|upstream_commit\|UPSTREAM_COMMIT" "$SRC/hermes_cli" 2>/dev/null | head -8 | sed "s|$SRC|<src>|" | cut -c1-170

          echo "===== F2) bounded real-request retry (max 3 attempts, ~75s apart) ====="
          OK=0
          for i in 1 2 3; do
            echo "--- attempt $i ---"
            timeout 150 hermes -z "Reply with exactly: pong" </dev/null >/tmp/req.out 2>&1
            rc=$?
            echo "rc=$rc"
            if [ $rc -eq 0 ] && grep -qi pong /tmp/req.out && ! grep -qi "503\|UNAVAILABLE\|high demand" /tmp/req.out; then
              echo "attempt $i: SUCCESS"
              tail -c 200 /tmp/req.out
              OK=1; break
            fi
            grep -oE "Gemini HTTP [0-9]+ \([A-Z_]+\)[^\"]*" /tmp/req.out | head -1 || tail -c 200 /tmp/req.out
            [ $i -lt 3 ] && sleep 75
          done
          rm -f /tmp/req.out
          if [ $OK -eq 1 ]; then
            echo "REAL_REQUEST=PASS"
            echo "PHASE9=OK"
          else
            echo "REAL_REQUEST=FAIL (still 503 after 3 bounded attempts)"
            echo "PHASE9=BLOCKED_BY_GOOGLE_CAPACITY"
            exit 1
          fi
          REMOTE
