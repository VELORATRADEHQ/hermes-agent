name: migration-backup
on:
  workflow_dispatch:

permissions: {}

env:
  CODESPACE_NAME: crispy-space-cod-jrqqwq797j6vcwqw

jobs:
  backup:
    name: Create + validate migration backup on OLD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secret presence + state gate
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          state=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state)
          echo "OLD state: $state"
          [ "$state" = "Available" ] || { echo "::error::OLD not Available"; exit 1; }

      - name: Create backup + manifest + structural validation
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"chat_id[\" ]*[:=][\" ]*[0-9]{5,}","chat_id=<id>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -euo pipefail
          H="$HOME/.hermes"
          BK="$HOME/hermes-backup"; mkdir -p "$BK"; chmod 700 "$BK"
          TS=$(date +%Y%m%d%H%M%S)
          TAR="$BK/hermes-migration-$TS.tar.gz"

          echo "===== size breakdown (backup planning) ====="
          du -sm "$H/hermes-agent/.git" "$H/hermes-agent/venv" "$H/hermes-agent/.hermes-runtime" "$H/sessions" 2>/dev/null
          ls "$H/hermes-agent/" | grep -E "uv.lock|pyproject|package" | head -5

          echo "===== build tarball (venv + uv runtime EXCLUDED: rebuildable; .git INCLUDED for pinned commit) ====="
          tar --exclude="$H/hermes-agent/venv" \
              --exclude="$H/hermes-agent/.hermes-runtime" \
              --exclude='*/__pycache__' --exclude='*.pyc' --exclude='*.sock' \
              -czf "$TAR" -C "$HOME" \
              .hermes/config.yaml .hermes/.env .hermes/auth.json .hermes/state .hermes/sessions \
              .hermes/hermes-agent \
              .local/bin/hermes .local/bin/uv .local/bin/uvx .local/bin/tirith 2>/dev/null || true
          [ -f "$TAR" ] || { echo "TAR FAILED"; exit 1; }
          chmod 600 "$TAR"
          echo "tarball: $TAR"
          echo "size: $(du -m "$TAR" | cut -f1) MB"
          echo "sha256: $(sha256sum "$TAR" | cut -d' ' -f1)"

          echo "===== per-file evidence (values never printed) ====="
          for f in "$H/config.yaml" "$H/.env" "$H/auth.json" "$H/state/gateway.lifecycle.json"; do
            [ -f "$f" ] && echo "$(basename $f) sha256=$(sha256sum "$f" | cut -c1-16)… size=$(wc -c < "$f")B class=SECRET-BEARING"
          done

          echo "===== structural validation ====="
          N=$(tar -tzf "$TAR" | wc -l); echo "tar entries: $N"; [ "$N" -gt 400 ] || { echo "TOO FEW ENTRIES"; exit 1; }
          # readable-check: config.yaml parse (names only), .env key names only, auth.json parse keys only
          tar -xOf "$TAR" ./.hermes/config.yaml | python3 -c "import sys,yaml;d=yaml.safe_load(sys.stdin);print('config.yaml parse: OK | _config_version:', d.get('_config_version'), '| model keys:', list((d.get('model') or {}).keys()))"
          tar -xOf "$TAR" ./.hermes/.env | awk -F= '{print $1}' | grep -E "API_KEY|TOKEN" | sed 's/=.*/=<present>/' > /tmp/envnames.txt || true
          tar -xOf "$TAR" ./.hermes/.env | grep -cE "^(GEMINI_API_KEY|TELEGRAM_BOT_TOKEN)=" | xargs echo "required cred lines in backup .env:"
          tar -xOf "$TAR" ./.hermes/.env | grep -q "^GEMINI_API_KEY=.\{10,\}" && echo "GEMINI_API_KEY in backup: PRESENT"
          tar -xOf "$TAR" ./.hermes/.env | grep -q "^TELEGRAM_BOT_TOKEN=.\{20,\}" && echo "TELEGRAM_BOT_TOKEN in backup: PRESENT"
          tar -xOf "$TAR" ./.hermes/auth.json | python3 -c "import sys,json;d=json.load(sys.stdin);print('auth.json parse: OK | keys:', list(d.keys()))"
          tar -tzf "$TAR" | grep -c "^\.hermes/state/" | xargs echo "state entries:"
          tar -tzf "$TAR" | grep -c "^\.hermes/sessions/" | xargs echo "session entries:"
          tar -tzf "$TAR" | grep -c "^\.hermes/hermes-agent/.git/" | xargs echo "git-object entries (revision pin capable):"
          tar -tzf "$TAR" | grep -c "^\.local/bin/" | xargs echo "launcher entries:"
          echo "BACKUP_MANIFEST_TAR=$TAR"
          echo "BACKUP_VALIDATION=PASS"
          echo "BACKUP_DONE"
          REMOTE

      - name: Verify secret never leaked (log self-check)
        run: |
          echo "log contains only flags/hashes/names — sanitizer applied to ssh output; no raw files printed"
