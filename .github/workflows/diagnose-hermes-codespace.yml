name: cpanel-healthcheck
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read gateway log tail + process state (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -euo pipefail
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          set -euo pipefail
          mask(){ sed -E 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[redacted-token]/g; s/(gh[pousr]_|github_pat_)[A-Za-z0-9_]+/[redacted]/g; s/AIza[0-9A-Za-z_-]{20,}/[redacted-gemini]/g'; }
          echo "===== processes ====="
          pgrep -af 'hermes gateway' | mask
          echo "===== heartbeat age ====="
          HB=/home/codespace/.hermes/state/gateway.heartbeat
          [ -f "$HB" ] && echo "heartbeat age: $(( $(date +%s) - $(stat -c %Y "$HB") ))s"
          echo "===== gateway log tail (sanitized) ====="
          tail -40 /home/codespace/.hermes/state/hermes-gateway.log | mask | grep -avi "debug" | tail -25
          echo "===== CHECK=DONE ====="
          REMOTE
