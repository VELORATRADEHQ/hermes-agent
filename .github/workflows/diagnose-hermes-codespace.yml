name: Diagnose Hermes Codespace (read-only)

# DIAGNOSTIC-ONLY. Phase 2: read gateway-exit-diag.log,
# gateway-shutdown-diag.log (redacted) and /proc/uptime from inside the
# existing Codespace. Zero installs/restarts/modifications.
# The credential is used only via the Actions secret reference and never printed.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: diagnose-hermes-codespace
  cancel-in-progress: false

env:
  CODESPACE_NAME: "crispy-space-cod-jrqqwq797j6vcwqw"

jobs:
  diagnose:
    name: SSH + exit-diag logs + uptime (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify credential availability (value never printed)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is missing - secret CODESPACE_LIFECYCLE_PAT is not configured."
            exit 1
          fi
          echo "GH_TOKEN is present"

      - name: Codespace state via API
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          state=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state 2>err.txt) || {
            echo "::error::Codespaces API query failed: $(head -c 200 err.txt)"
            rm -f err.txt
            exit 1
          }
          rm -f err.txt
          echo "Codespace state: ${state}"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Probe gh codespace ssh capability
        id: sshcheck
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          STATE: ${{ steps.precheck.outputs.state }}
        run: |
          if [ "$STATE" != "Available" ]; then
            echo "Codespace state is '$STATE' (not Available). Diagnostic-only: NO start performed."
            echo "ssh=skipped-stopped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if out=$(gh codespace ssh --codespace "$CODESPACE_NAME" -- sh -c 'echo SSH_OK; hostname; whoami' 2>ssh_err.txt); then
            echo "$out"
            echo "ssh=ok" >> "$GITHUB_OUTPUT"
          else
            echo "gh codespace ssh FAILED:"
            head -c 400 ssh_err.txt
            echo "ssh=failed" >> "$GITHUB_OUTPUT"
          fi
          rm -f ssh_err.txt

      - name: Read exit-diag logs + uptime INSIDE the Codespace (redacted)
        if: steps.sshcheck.outputs.ssh == 'ok'
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE'
          set +e
          redact() {
            sed -E \
              -e 's/[0-9]{8,10}:[A-Za-z0-9_-]{30,}/<TG_TOKEN_REDACTED>/g' \
              -e 's/(github_pat_|ghp_)[A-Za-z0-9_]+/<GH_TOKEN_REDACTED>/g' \
              -e 's/sk-[A-Za-z0-9_-]{20,}/<API_KEY_REDACTED>/g' \
              -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._-]+/\1<REDACTED>/g' \
              -e 's/eyJ[A-Za-z0-9._-]{20,}/<JWT_REDACTED>/g'
          }

          echo "### SECTION: proc-uptime"
          now_epoch=$(date +%s)
          up_s=$(cut -d. -f1 /proc/uptime)
          echo "now_utc: $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "uptime_seconds: $up_s"
          boot_epoch=$((now_epoch - up_s))
          echo "computed_boot_utc: $(date -u -d "@$boot_epoch" +'%Y-%m-%d %H:%M:%S')"

          echo "### SECTION: gateway-exit-diag.log (redacted, relevant tail)"
          f="$HOME/.hermes/logs/gateway-exit-diag.log"
          if [ -f "$f" ]; then
            echo "path: $f | mtime: $(stat -c %y "$f") | size: $(stat -c %s "$f") bytes"
            redact < "$f" | tail -n 50
          else
            echo "NOT FOUND at $f"
          fi

          echo "### SECTION: gateway-shutdown-diag.log (redacted, relevant tail)"
          f="$HOME/.hermes/logs/gateway-shutdown-diag.log"
          if [ -f "$f" ]; then
            echo "path: $f | mtime: $(stat -c %y "$f") | size: $(stat -c %s "$f") bytes"
            redact < "$f" | tail -n 50
          else
            echo "NOT FOUND at $f"
          fi
          echo "### END"
          REMOTE
