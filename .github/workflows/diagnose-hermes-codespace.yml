name: telegram-phase2-launch
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: Telegram Phase-2 launch gateway (test-scoped)
    runs-on: ubuntu-latest
    env:
      CODESPACE_NAME: crispy-space-cod-jrqqwq797j6vcwqw
    steps:
      - name: Preconditions + state gate (no lifecycle action)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          state=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state)
          echo "codespace state: $state"
          [ "$state" = "Available" ] || { echo "::error::Not Available; NO start performed (policy)"; exit 1; }

      - name: Start gateway (test-scoped, foreground-based, killable) + readiness
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"chat_id[\" ]*[:=][\" ]*[0-9]{5,}","chat_id=<id>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -uo pipefail
          H="$HOME/.hermes"; SRC="$H/hermes-agent"
          export PATH="$H/bin:$PATH"

          echo "===== A) allowlist behavior evidence (source, read-only) ====="
          grep -rn "allowed_users\|allowlist\|allow_list\|TELEGRAM_ALLOWED\|allowed\b" "$SRC/hermes_cli" 2>/dev/null \
            | grep -i "tele\|gateway\|allow" | head -12 | sed "s|$SRC|<src>|" | cut -c1-180

          echo "===== B) pre-check: no gateway already running ====="
          if pgrep -af "hermes.*gateway" | grep -vi pgrep >/dev/null 2>&1; then
            echo "gateway process already exists — refusing double-start"
            pgrep -af "hermes.*gateway" | grep -vi pgrep | head -5
            echo "GATEWAY_UP=ALREADY_RUNNING"; exit 1
          fi
          echo "none running — ok"

          echo "===== C) start: hermes gateway run (detached for test window) ====="
          cd "$HOME"
          nohup hermes gateway --accept-hooks run > /tmp/hermes-gateway.log 2>&1 &
          GPID=$!
          echo "$GPID" > /tmp/gw.pid
          echo "spawned pid: $GPID"
          sleep 3

          echo "===== D) readiness polling (max ~150s) ====="
          READY=0
          for i in $(seq 1 30); do
            if ! kill -0 "$GPID" 2>/dev/null; then
              echo "process $GPID DIED at poll $i"; READY=-1; break
            fi
            if grep -qiE "poll|telegram gateway|listening|getMe|connected|✓.*telegram|webhook" /tmp/hermes-gateway.log 2>/dev/null; then
              echo "readiness marker found at poll $i (~$((i*5))s)"; READY=1; break
            fi
            sleep 5
          done
          echo "READY=$READY"
          echo "--- effective config (redacted) ---"
          echo "model.provider = $(hermes config get model.provider 2>/dev/null)"
          echo "model.default  = $(hermes config get model.default 2>/dev/null)"
          kill -0 "$GPID" 2>/dev/null && echo "process alive: pid $GPID" || echo "process NOT alive"

          echo "===== E) gateway log (sanitized, first 50 lines) ====="
          head -50 /tmp/hermes-gateway.log 2>/dev/null | cut -c1-200

          echo "===== F) verdict ====="
          if [ "$READY" = "1" ]; then
            echo "GATEWAY_UP=YES pid=$GPID"
          else
            echo "GATEWAY_UP=NO"
            echo "--- last 30 log lines ---"
            tail -30 /tmp/hermes-gateway.log 2>/dev/null | cut -c1-200
            kill "$GPID" 2>/dev/null; sleep 2; kill -9 "$GPID" 2>/dev/null
            echo "(attempted cleanup)"
            echo "RESULT=NOT_READY reason=gateway_failed_to_start"
            exit 1
          fi
          REMOTE
