name: cp-inspect-6
on:
  workflow_dispatch:
jobs:
  inspect6:
    runs-on: ubuntu-latest
    steps:
      - name: Final pre-implementation code read (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          R=/home/codespace/.hermes/hermes-agent
          A="$R/plugins/platforms/telegram/adapter.py"
          echo "===== 1) slash_commands.py registry ====="
          grep -nE '^(COMMANDS|_COMMANDS|SLASH|def |class |    def )' "$R/gateway/slash_commands.py" | head -30
          echo "===== 2) callback handler body ====="
          sed -n '4304,4420p' "$A"
          echo "===== 3) menu commands source ====="
          grep -nE 'def telegram_menu_commands|def telegram_menu_max_commands|menu' "$R/hermes_cli/commands_platforms.py" | head -10
          echo "===== 4) slash access scope keys ====="
          sed -n '21,56p' "$R/gateway/slash_access.py"
          echo "===== 5) custom providers config key (callers) ====="
          grep -rn 'providers_dict_to_custom_providers\|get_compatible_custom_providers' "$R" --include='*.py' --exclude-dir=venv --exclude-dir=.venv | grep -v tests | grep -v 'def ' | head -8
          echo "===== 6) ProviderProfile fields ====="
          sed -n '39,110p' "$R/providers/base.py"
          echo "===== 7) auth.json top-level structure (keys only) ====="
          python3 -c "import json;d=json.load(open('/home/codespace/.hermes/auth.json'));print(type(d).__name__); print(list(d.keys())[:12] if isinstance(d,dict) else len(d))"
          echo "===== 8) edit_message usage in adapter ====="
          grep -nE 'edit_message_text|edit_message_reply_markup' "$A" | head -8
          echo "===== 9) pairing store methods ====="
          grep -nE '    def (list_|get_|approve|decline|reject|revoke|remove|is_)' "$R/gateway/pairing.py" | head -15
          echo "===== 10) PTB version ====="
          "$R/venv/bin/python" -c "import telegram; print('python-telegram-bot', telegram.__version__)"
          REMOTE
          echo "===== INSPECT6=DONE ====="
