name: migration-backup-final-validate
on:
  workflow_dispatch:

permissions: {}

env:
  CODESPACE_NAME: crispy-space-cod-jrqqwq797j6vcwqw

jobs:
  fvalidate:
    name: Final backup validation (no streaming grep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gates
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          st=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state); echo "OLD state: $st"
          [ "$st" = "Available" ] || { echo "::error::not Available"; exit 1; }

      - name: Validate both archives (listing-to-file method)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"chat_id[\" ]*[:=][\" ]*[0-9]{5,}","chat_id=<id>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -euo pipefail
          BK="$HOME/hermes-backup"
          C=$(ls -t "$BK"/migration-critical-*.tar.gz | head -1)
          S=$(ls -t "$BK"/migration-state-*.tar.gz | head -1)
          T="$BK/hermes-migration-20260915233438.tar.gz"
          echo "artifacts:"
          ls -la "$BK" | awk 'NR>1{print " ", $NF, $5"B"}' | grep -v "^\s*$"

          echo "===== critical archive checks ====="
          tar -tzf "$C" > /tmp/lc.txt
          for m in .hermes/config.yaml .hermes/.env .hermes/auth.json .local/bin/hermes .local/bin/uv; do
            grep -qF "$m" /tmp/lc.txt && echo "$m: PRESENT" || { echo "$m: MISSING"; exit 1; }
          done
          echo "entries: $(wc -l < /tmp/lc.txt)"
          tar -xOf "$C" .hermes/config.yaml | python3 -c "import sys,yaml;d=yaml.safe_load(sys.stdin);print('config.yaml parse OK | version:', d.get('_config_version'), '| model:', d.get('model'))"
          tar -xOf "$C" .hermes/.env | grep -q "^GEMINI_API_KEY=.\{10,\}" && echo "GEMINI_API_KEY: PRESENT(len)"
          tar -xOf "$C" .hermes/.env | grep -q "^TELEGRAM_BOT_TOKEN=.\{20,\}" && echo "TELEGRAM_BOT_TOKEN: PRESENT(len)"
          tar -xOf "$C" .hermes/auth.json | python3 -c "import sys,json;d=json.load(sys.stdin);print('auth.json parse OK keys:', list(d.keys()))"
          echo "sessions entries: $(grep -c 'hermes/sessions/' /tmp/lc.txt)"

          echo "===== state snapshot archive checks ====="
          tar -tzf "$S" > /tmp/ls.txt
          grep -c "gateway.lifecycle.json\|gateway.heartbeat" /tmp/ls.txt | xargs echo "state key files:"

          echo "===== big source archive checks ====="
          tar -tzf "$T" > /tmp/lb.txt
          echo "entries: $(wc -l < /tmp/lb.txt)"
          for m in .hermes/config.yaml .hermes/hermes-agent/uv.lock .hermes/hermes-agent/pyproject.toml; do
            grep -qF "$m" /tmp/lb.txt && echo "$m: PRESENT" || echo "$m: absent"
          done
          echo ".git members: $(grep -c 'hermes-agent/.git/' /tmp/lb.txt)"
          echo "cli key file: $(grep -c 'hermes_cli/cli_model_switch_mixin.py' /tmp/lb.txt)"
          grep -qF "hermes-agent/.git/refs" /tmp/lb.txt && echo "git refs present (commit 5d593660 pin-reproducible offline)"
          echo "FINAL_VALIDATION=PASS"
          echo "VALIDATION_DONE"
          REMOTE
