name: pairing-approve
on:
  workflow_dispatch:
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve telegram pairing code on NEW codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys, re
          for l in sys.stdin:
              l = re.sub(r"[0-9]{6,}", "[id]", l)
              sys.stdout.write(l)
          '
          H=/home/codespace/.hermes/hermes-agent/venv/bin/python
          cd /home/codespace
          echo "gateway running: $(pgrep -fc 'hermes gateway' || echo 0)"
          ~/.local/bin/hermes pairing approve telegram GSECGE7H; echo "APPROVE_RC=$?"
          echo "--- pairing state (sanitized) ---"
          ~/.local/bin/hermes pairing list 2>/dev/null || true
          REMOTE
          echo "===== PAIRING=DONE ====="
