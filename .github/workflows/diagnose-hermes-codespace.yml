name: cpanel-deploy8
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
    steps:
      - name: Deploy hermes-cpanel -> codespace, test, restart gateway (value never printed)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$CS" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+|X-Browser-Use-API-Key:\s*)[A-Za-z0-9._-]{8,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -uo pipefail
          H="$HOME/.hermes"; R="$H/hermes-agent"
          LOG="$H/state/hermes-gateway.log"
          echo "===== D1) pull deploy ref ====="
          cd "$R" || exit 1
          git fetch origin hermes-cpanel --depth=10 2>&1 | tail -2
          git reset --hard origin/hermes-cpanel >/dev/null 2>&1 || exit 1
          HEAD_NEW=$(git rev-parse --short HEAD)
          echo "deployed_head=$HEAD_NEW"
          echo "task_runtime_present=$(test -f gateway/task_runtime.py && echo yes || echo no)"

          echo "===== D2) venv dependency smoke ====="
          . "$R/.venv/bin/activate" || { echo "::error::venv missing"; exit 1; }
          python -c "import httpx, yaml; import gateway.task_runtime as t; print('task_runtime import OK, statuses:', len(t.ALL_STATUSES))"

          echo "===== D3) focused test matrix on deployed tree ====="
          cd "$R"
          PYTHONPATH="$R" python -m pytest -q \
            tests/gateway/test_task_runtime.py \
            tests/gateway/test_cpanel_model_apply.py \
            tests/gateway/test_cpanel_t5.py \
            tests/gateway/test_cpanel_t7.py \
            tests/gateway/test_provider_probe.py \
            tests/gateway/test_model_picker_persist.py \
            tests/gateway/test_session_model_override_persistence.py \
            tests/gateway/test_help_surface.py 2>&1 | tail -4

          echo "===== D4) locale parity invariant ====="
          python - <<'PYEOF'
          import glob, yaml
          def flat(d, p=""):
              ks=set()
              for k,v in (d or {}).items():
                  if isinstance(v,dict): ks|=flat(v,p+str(k)+".")
                  else: ks.add(p+str(k))
              return ks
          docs={p.split("/")[-1]: yaml.safe_load(open(p,encoding="utf-8")) for p in glob.glob("locales/*.yaml")}
          ref=flat(docs["en.yaml"])
          bad={n:len(ref-flat(d)) for n,d in docs.items() if flat(d)!=ref}
          print("PARITY:","OK" if not bad else bad)
          PYEOF

          echo "===== D5) restart gateway on new head ====="
          if pgrep -f "hermes.*gateway" | grep -v $$ >/dev/null 2>&1; then
            pkill -f "hermes.*gateway" 2>/dev/null
            for i in $(seq 1 10); do pgrep -f "hermes.*gateway" >/dev/null 2>&1 || break; sleep 2; done
            echo "old gateway stopped"
          fi
          OFF=$(wc -c < "$LOG" 2>/dev/null || echo 0)
          export PATH="$H/bin:$PATH"
          cd "$HOME"
          nohup hermes gateway --accept-hooks run >> "$LOG" 2>&1 &
          GPID=$!
          READY=0
          for i in $(seq 1 24); do
            if ! kill -0 "$GPID" 2>/dev/null; then echo "process died during boot"; break; fi
            if tail -c +$((OFF+1)) "$LOG" 2>/dev/null | grep -qiE "Connected to Telegram|polling mode"; then READY=1; break; fi
            sleep 5
          done
          [ "$READY" = "1" ] && echo "GATEWAY=STARTED pid=$GPID head=$HEAD_NEW" || { echo "GATEWAY=START_FAILED"; tail -12 "$LOG" | cut -c1-160; exit 1; }
          echo "===== DEPLOY8=DONE ====="
          REMOTE
