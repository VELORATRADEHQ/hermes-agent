name: cp-inspect-4
on:
  workflow_dispatch:
jobs:
  inspect4:
    runs-on: ubuntu-latest
    steps:
      - name: Architecture inspection round 4 (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          R=/home/codespace/.hermes/hermes-agent
          echo "===== A) gateway core files ====="
          ls "$R/gateway/" | grep -vE '\.pyc|__pycache__' | grep -E 'slash|command|admin|control|panel' || echo "no slash/admin files"
          ls "$R/gateway/" | grep -v __pycache__ | head -30
          echo "===== B) config_providers def index ====="
          grep -nE '^(class |def |    def )' "$R/hermes_cli/config_providers.py" | head -30
          echo "===== C) where provider config is WRITTEN ====="
          grep -nE 'safe_dump|write_text|set_key|dotenv|\.env' "$R/hermes_cli/config_providers.py" | head -12
          echo "===== D) callback-query handler + data prefixes ====="
          grep -n 'async def _handle_callback_query' "$R/plugins/platforms/telegram/adapter.py"
          grep -nE 'data\.(startswith|split)|callback_data=' "$R/plugins/platforms/telegram/adapter.py" | head -18
          echo "===== E) menu_commands construction ====="
          grep -n 'menu_commands' "$R/plugins/platforms/telegram/adapter.py" | head -6
          echo "===== F) slash command registry ====="
          grep -nE '^(class |def |    def )' "$R/gateway/slash_commands_model.py" | head -12
          grep -rln 'register_slash\|SLASH_COMMANDS\|slash_dispatch' "$R/gateway/" --include='*.py' | grep -v __pycache__ | head -6
          echo "===== G) provider catalog (supported providers) ====="
          grep -nE '^\s*["\x27](google|openai|anthropic|openrouter|groq|mistral|xai|nvidia|kimi|nous|deepseek|ollama|azure|bedrock|custom)' "$R/hermes_cli/provider_catalog.py" | head -25
          wc -l "$R/hermes_cli/provider_catalog.py"
          echo "===== H) approval flow (buttons precedent) ====="
          grep -nE '^(class |def |    def |EA_)' "$R/gateway/platforms/base_exec_approval.py" | head -15
          echo "===== I) remote ====="
          git -c safe.directory='*' -C "$R" remote -v | sed 's|https://[^@]*@|https://[redacted]@|' | head -3
          REMOTE
          echo "===== INSPECT4=DONE ====="
