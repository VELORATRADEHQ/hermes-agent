name: migration-final-audit-3
on:
  workflow_dispatch:
jobs:
  audit3:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NEW (pinned rev + python, correct paths)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          R=/home/codespace/.hermes/hermes-agent
          git -c safe.directory='*' -C "$R" rev-parse --short=10 HEAD | sed 's/^/pinned_revision: /'
          "$R/venv/bin/python" --version 2>&1 | head -1 | sed 's/^/venv_python: /'
          "$R/venv/bin/python" -m hermes --version 2>/dev/null | head -1 | sed 's/^/hermes_version: /' || "$R/venv/bin/python" -c "import importlib.metadata as m;print('hermes_version:', m.version('hermes-agent'))" 2>/dev/null | head -1
          REMOTE
          echo "===== AUDIT3=DONE ====="
