name: migration-backup-validate
on:
  workflow_dispatch:

permissions: {}

env:
  CODESPACE_NAME: crispy-space-cod-jrqqwq797j6vcwqw
  TARP: /home/codespace/hermes-backup/hermes-migration-20260915233438.tar.gz

jobs:
  validate:
    name: Validate existing migration tarball (no rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Gates
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          st=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state); echo "OLD state: $st"
          [ "$st" = "Available" ] || { echo "::error::not Available"; exit 1; }

      - name: Structural validation (paths fixed)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"chat_id[\" ]*[:=][\" ]*[0-9]{5,}","chat_id=<id>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -euo pipefail
          T="$TARP"
          [ -s "$T" ] || { echo "TARBALL MISSING"; exit 1; }
          echo "tarball re-verify sha256: $(sha256sum "$T" | cut -d' ' -f1)"
          echo "entries: $(tar -tzf "$T" | wc -l)"
          echo "--- exact member presence ---"
          for m in .hermes/config.yaml .hermes/.env .hermes/auth.json .local/bin/hermes .local/bin/uv; do
            tar -tzf "$T" 2>/dev/null | grep -q "^\./$m\$\|^$m\$" && echo "$m: IN ARCHIVE" || { echo "$m: MISSING"; exit 1; }
          done
          M=$(tar -tzf "$T" | sed -n '1p'); echo "first member: $M"
          PFX="./"; [ "${M#.hermes}" != "$M" ] && PFX=""
          echo "member prefix style: '$PFX'"
          tar -xOf "$T" "${PFX}.hermes/config.yaml" | python3 -c "import sys,yaml;d=yaml.safe_load(sys.stdin);print('config.yaml parse: OK | _config_version:', d.get('_config_version'), '| model:', d.get('model'))"
          tar -xOf "$T" "${PFX}.hermes/.env" | grep -q "^GEMINI_API_KEY=.\{10,\}" && echo "GEMINI_API_KEY: PRESENT (length-check)"
          tar -xOf "$T" "${PFX}.hermes/.env" | grep -q "^TELEGRAM_BOT_TOKEN=.\{20,\}" && echo "TELEGRAM_BOT_TOKEN: PRESENT (length-check)"
          tar -xOf "$T" "${PFX}.hermes/auth.json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('auth.json parse: OK | keys:', list(d.keys()))"
          echo "state entries: $(tar -tzf "$T" | grep -c 'hermes/state/')"
          echo "session entries: $(tar -tzf "$T" | grep -c 'hermes/sessions/')"
          echo "git-object entries: $(tar -tzf "$T" | grep -c 'hermes-agent/.git/')"
          echo "launcher entries: $(tar -tzf "$T" | grep -c 'local/bin/')"
          echo "BACKUP_VALIDATION=PASS"
          echo "VALIDATION_DONE"
          REMOTE
