name: Diagnose Hermes Codespace (read-only)

# Read-only evidence check: does Hermes support in-chat model switching
# (e.g., a /model command in the Telegram gateway or CLI)?

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: diagnose-hermes-codespace
  cancel-in-progress: false

env:
  CODESPACE_NAME: "crispy-space-cod-jrqqwq797j6vcwqw"

jobs:
  diagnose:
    name: Model-switch capability check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify credential availability (value never printed)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is missing."
            exit 1
          fi
          echo "GH_TOKEN is present"

      - name: Codespace state via API
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          state=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state 2>err.txt) || { echo "::error::API failed"; cat err.txt | head -c 200; rm -f err.txt; exit 1; }
          rm -f err.txt
          echo "Codespace state: ${state}"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Probe gh codespace ssh capability
        id: sshcheck
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          STATE: ${{ steps.precheck.outputs.state }}
        run: |
          if [ "$STATE" != "Available" ]; then
            echo "Not Available; NO start performed."
            echo "ssh=skipped-stopped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if out=$(gh codespace ssh --codespace "$CODESPACE_NAME" -- sh -c 'echo SSH_OK' 2>e.txt); then
            echo "$out"; echo "ssh=ok" >> "$GITHUB_OUTPUT"
          else
            echo "ssh FAILED:"; head -c 300 e.txt; echo "ssh=failed" >> "$GITHUB_OUTPUT"
          fi
          rm -f e.txt

      - name: Investigate in-chat model switching (read-only)
        if: steps.sshcheck.outputs.ssh == 'ok'
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE'
          set +e
          H="$HOME/.hermes/hermes-agent"
          HBIN="$HOME/.local/bin/hermes"

          echo "### Q1: hermes top-level help (subcommands)"
          "$HBIN" --help 2>&1 | head -60

          echo "### Q2: docs mentioning /model or slash commands"
          grep -rliE "/model|slash.?command" "$H/website/docs" 2>/dev/null | head -12
          echo "--- occurrences of slash-command tokens in docs ---"
          grep -rhoE '`/[a-z][a-z_-]{1,20}`' "$H/website/docs" 2>/dev/null | sort | uniq -c | sort -rn | head -20

          echo "### Q3: slash-command handling in source (CLI)"
          grep -rlnE '"/model"|'"'"'/model'"'"'' "$H/hermes_cli" "$H/agent" 2>/dev/null | head -10
          echo "--- command registry candidates in hermes_cli ---"
          grep -rhoE '"/[a-z][a-z_-]{1,18}"' "$H/hermes_cli" 2>/dev/null | sort | uniq -c | sort -rn | head -25

          echo "### Q4: telegram gateway slash commands"
          GW=$(grep -rln "telegram" "$H" --include="*gateway*.py" 2>/dev/null | head -3)
          echo "gateway files: $GW"
          grep -rhoE '"/[a-z][a-z_-]{1,18}"' $GW 2>/dev/null | sort | uniq -c | sort -rn | head -25

          echo "### Q5: docs snippets around /model"
          grep -rh -B2 -A6 '"/model"\|`/model`' "$H/website/docs" 2>/dev/null | head -60
          echo "### END QA"
          REMOTE
