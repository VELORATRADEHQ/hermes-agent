name: cpanel-deploy5
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/art
          echo  | base64 -d > /tmp/art/cpanel.py
          echo  | base64 -d > /tmp/art/test_cpanel_t5.py
          echo  | base64 -d > /tmp/art/cpanel_patch_v3.py
          python3 -c "import ast; ast.parse(open('/tmp/art/cpanel.py').read()); ast.parse(open('/tmp/art/test_cpanel_t5.py').read()); ast.parse(open('/tmp/art/cpanel_patch_v3.py').read()); print('SYNTAX_OK')"
      - name: Pre-flight + apply + test + commit + push + restart + health
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -euo pipefail
          base64 -w0 /tmp/art/cpanel.py | gh codespace ssh --codespace "$NEW_CS" -- bash -c 'base64 -d > /tmp/art_cpanel.py'
          base64 -w0 /tmp/art/test_cpanel_t5.py | gh codespace ssh --codespace "$NEW_CS" -- bash -c 'base64 -d > /tmp/art_test5.py'
          base64 -w0 /tmp/art/cpanel_patch_v3.py | gh codespace ssh --codespace "$NEW_CS" -- bash -c 'base64 -d > /tmp/art_patchv3.py'
          gh codespace ssh --codespace "$NEW_CS" -- bash -c 'cd /tmp && python3 -m py_compile art_cpanel.py art_test5.py art_patchv3.py && echo REMOTE_SYNTAX_OK'
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          set -euo pipefail
          mask(){ sed -E 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[redacted-token]/g; s/AIza[0-9A-Za-z_-]{20,}/[redacted-gemini]/g'; }
          R=/home/codespace/.hermes/hermes-agent
          EXPECT=d11aaf13ad657bef0d1e46261e3c3dd9347552ee
          TIP=$(git -C "$R" rev-parse hermes-cpanel)
          [ "$TIP" = "$EXPECT" ] || { echo "ABORT: branch tip drifted ($TIP != $EXPECT) — no changes made"; exit 2; }
          . "$R/.venv/bin/activate"
          export PYTHONPATH="$R"
          cd "$R"
          # freshness gate: deploy only the artifact we measured against
          sha256sum /tmp/art_cpanel.py | mask

          # 1) apply cpanel
          cp /tmp/art_cpanel.py gateway/cpanel.py
          python3 -m py_compile gateway/cpanel.py && echo COMPILE_OK

          # 2) locales v3 (idempotent in-place, fa real values + en stubs)
          python3 /tmp/art_patchv3.py
          python3 - <<'PY'
          import sys, yaml, glob
          sets=[]
          for f in sorted(glob.glob("locales/*.yaml")):
              d=yaml.safe_load(open(f)) or {}
              cpd=d.get("cpanel") or {}
              for sec in ("persist","cust","cwx"):
                  assert sec in cpd, f"{f}: missing cpanel.{sec}"
              assert "404" in (cpd.get("test") or {}), f"{f}: missing cpanel.test.404"
              sets.append((f, cpd["persist"]["button"]))
          print("LOCALE_CHECK_OK", len(sets), "locales;", dict(sets)['locales/fa.yaml'])
          PY

          # 3) tests (offline + integration-free)
          cp /tmp/art_test5.py tests/gateway/test_cpanel_t5.py
          echo "=== SUITE: cpanel existing ==="
          pytest -q tests/gateway/test_cpanel.py | mask | tail -4
          echo "=== SUITE: cpanel t5 (persist+custom) ==="
          pytest -q tests/gateway/test_cpanel_t5.py | mask | tail -4
          echo "=== SUITE: native custom-provider ==="
          pytest -q tests/tui_gateway/test_custom_provider_session_persistence.py tests/hermes_cli/test_model_provider_persistence.py 2>&1 | mask | tail -4
          echo "=== SUITE: telegram adapter order I ==="
          pytest -q tests/gateway/test_telegram_auth_check.py tests/gateway/test_telegram_callback_auth_fail_closed.py tests/gateway/test_custom_provider_request_overrides.py 2>&1 | mask | tail -4
          echo "TEST_GATES=DONE"

          # 4) separately staged commits on the working branch (one file per commit)
          git config user.name "bot-hermes"
          git config user.email "bot@local"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/VELORATRADEHQ/hermes-agent.git"
          git add gateway/cpanel.py
          git commit -m "checkpoint cpanel v13 (persist control + custom provider)" -- gateway/cpanel.py | mask
          git push origin hermes-cpanel | mask
          git add tests/gateway/test_cpanel_t5.py
          git commit -m "test: cpanel persist+custom-provider coverage (36 tests)" -- tests/gateway/test_cpanel_t5.py | mask
          git push origin hermes-cpanel | mask
          git add locales/fa.yaml
          git commit -m "checkpoint cpanel i18n v3: fa persist+cust+cwx values" -- locales/fa.yaml | mask || true
          git push origin hermes-cpanel | mask
          git add locales/en.yaml
          git commit -m "checkpoint cpanel i18n v3: en persist+cust+cwx values" -- locales/en.yaml | mask || true
          git push origin hermes-cpanel | mask
          STAGED=$(git status --porcelain 'locales/*.yaml' | awk '{print $2}' | tr '\n' ' ')
          if [ -n "$STAGED" ]; then
            git add $STAGED
            git commit -m "checkpoint cpanel i18n v3: en stubs for remaining locales" -- $STAGED | mask || true
            git push origin hermes-cpanel | mask
          fi
          NEW_TIP=$(git rev-parse hermes-cpanel)
          echo "NEWTIP=$NEW_TIP"

          # 5) restart gateway via supervisor-visible pkill (long-poll mode)
          pkill -f 'hermes gateway' || true
          sleep 6
          for i in $(seq 1 24); do
            pgrep -f 'hermes gateway' >/dev/null && break
            sleep 5
          done
          pgrep -af 'hermes gateway' | mask
          sleep 4
          HB=/home/codespace/.hermes/state/gateway.heartbeat
          [ -f "$HB" ] && echo "heartbeat age: $(( $(date +%s) - $(stat -c %Y "$HB") ))s"
          grep -a "Connected to Telegram\|polling" /home/codespace/.hermes/state/hermes-gateway.log | mask | tail -3
          grep -a "${NEW_TIP:0:8}" /home/codespace/.hermes/state/hermes-gateway.log | mask | tail -2 || true
          echo "CHECK=DONE"
          REMOTE
          echo "PHASE1=OK"
