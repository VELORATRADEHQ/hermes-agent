name: post-migration-reverify
on:
  workflow_dispatch:
jobs:
  migrate3:
    runs-on: ubuntu-latest
    steps:
      - name: Post-migration re-verify (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          cd /home/codespace/.hermes/hermes-agent
          g(){ git -c safe.directory='*' "$@"; }
          echo "pwd: $(pwd)"
          echo "branch: $(g rev-parse --abbrev-ref HEAD)"
          echo "HEAD: $(g rev-parse HEAD)"
          echo "--- remotes:"; g remote -v
          echo "--- status:"; g status --porcelain=v1
          echo "version: $(grep -m1 '^version' pyproject.toml)"
          venv/bin/python -c "import gateway, plugins.platforms.telegram.adapter, providers; print('IMPORT_OK')"
          echo "gateway running: $(pgrep -fc 'hermes gateway' || echo 0)"
          echo "===== REVERIFY=DONE ====="
          REMOTE
