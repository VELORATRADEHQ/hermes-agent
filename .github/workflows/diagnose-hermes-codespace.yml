name: cp-inspect-5
on:
  workflow_dispatch:
jobs:
  inspect5:
    runs-on: ubuntu-latest
    steps:
      - name: Architecture inspection round 5 (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          R=/home/codespace/.hermes/hermes-agent
          echo "===== A) install mode ====="
          "$R/venv/bin/python" -c "import hermes_gateway_run_check" 2>/dev/null || true
          "$R/venv/bin/pip" list 2>/dev/null | grep -i hermes || "$R/venv/bin/python" -m pip list 2>/dev/null | grep -i hermes
          "$R/venv/bin/python" -c "import gateway, plugins.platforms.telegram.adapter as a; print('gateway from:', gateway.__file__); print('adapter from:', a.__file__)"
          echo "===== B) cp: prefix context at 3958 ====="
          sed -n '3948,3962p' "$R/plugins/platforms/telegram/adapter.py"
          echo "===== C) _save_gateway_config_key usage ====="
          sed -n '561,576p' "$R/gateway/slash_commands_model.py"
          echo "===== D) providers map in config.yaml (masked) ====="
          python3 - <<'PYEOF'
          import yaml,re
          c=yaml.safe_load(open('/home/codespace/.hermes/config.yaml'))
          def mask(x):
            if isinstance(x,dict): return {k:('[masked]' if re.search('key|token|secret',k,re.I) else mask(v)) for k,v in x.items()}
            if isinstance(x,list): return [mask(v) for v in x]
            return x
          m=c.get('model',{})
          print('model keys:', sorted(m.keys()))
          prov=m.get('providers')
          print('providers type:', type(prov).__name__)
          if prov: print(yaml.safe_dump(mask(prov), default_flow_style=False)[:900])
          PYEOF
          echo "===== E) owner/admin concept in pairing ====="
          grep -nE 'owner|admin|role' "$R/gateway/pairing.py" | head -12
          echo "--- approved telegram file keys (masked):"
          python3 - <<'PYEOF2'
          import json,glob
          for p in glob.glob('/home/codespace/.hermes/pairing/*telegram*')+glob.glob('/home/codespace/.hermes/pairing/approved*'):
            d=json.load(open(p))
            print(p.split('/')[-1], '->', type(d).__name__, list(d.keys())[:6] if isinstance(d,dict) else len(d))
          PYEOF2
          echo "===== F) slash_access (admin gate?) ====="
          grep -nE '^(class |def |    def |[A-Z_]+ =)' "$R/gateway/slash_access.py" | head -15
          echo "===== G) i18n catalog format sample ====="
          head -12 "$R/locales/en.yaml"
          echo "--- language selection source:"
          grep -nE 'get_language|HERMES_LANG|display.*language|language.*config' "$R/agent/i18n.py" | head -8
          echo "===== H) control-style sender signature ====="
          sed -n '3777,3800p' "$R/plugins/platforms/telegram/adapter.py"
          REMOTE
          echo "===== INSPECT5=DONE ====="
