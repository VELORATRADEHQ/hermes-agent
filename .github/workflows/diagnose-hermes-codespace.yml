name: canonical-repo-migration-continue
on:
  workflow_dispatch:
jobs:
  migrate2:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged state (STOP on drift) + final scan
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          set -euo pipefail
          cd /home/codespace/.hermes/hermes-agent
          g(){ git -c safe.directory='*' "$@"; }
          [ "$(g rev-parse HEAD)" = "1249435e5854dad86f853d6240a770d371161621" ] || { echo "STOP MERGED_HEAD_DRIFT got=$(g rev-parse HEAD)"; exit 2; }
          [ "$(g rev-parse --abbrev-ref HEAD)" = "main" ] || { echo "STOP NOT_ON_MAIN"; exit 3; }
          X=$(g status --porcelain=v1 | grep -vc '^?? venv$' || true)
          [ "$X" = "0" ] || { echo "STOP STATUS_DRIFT"; g status --porcelain=v1 | head; exit 4; }
          venv/bin/python - <<'PYEOF'
          import re, subprocess, collections, sys
          pats = {
            'telegram_bot_token': r'\b\d{6,}:[A-Za-z0-9_-]{30,}',
            'openai_style_sk':  r'\bsk-[A-Za-z0-9_-]{20,}',
            'gemini_aq':        r'\bAQ\.[A-Za-z0-9_-]{8,}',
            'google_aiza':      r'\bAIza[0-9A-Za-z_-]{20,}',
            'github_pat':       r'\bgh[pousr]_[A-Za-z0-9]{20,}|\bgithub_pat_[A-Za-z0-9_]{20,}',
            'aws_akia':         r'\bAKIA[0-9A-Z]{16}',
            'slack_xox':        r'\bxox[bpoas]-[A-Za-z0-9-]{10,}',
            'private_key_pem':  r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
          }
          files = subprocess.run(['git','-c','safe.directory=*','ls-files'], capture_output=True, text=True).stdout.splitlines()
          real=[]; fixtures=collections.Counter(); templates=[]
          for f in files:
            lf=f.lower()
            if lf.endswith(('.example','.sample','.template')):
              templates.append(f)
            elif lf.endswith('auth.json') or lf=='.env' or re.search(r'(^|/)\.env(\.|$)', lf):
              real.append(f'CREDENTIAL_FILE_TRACKED {f}'); continue
            if any(x in f for x in ('venv/','.venv/','backups/')): continue
            try: data=open(f,'rb').read(400000).decode('utf-8','ignore')
            except Exception: continue
            for name,rx in pats.items():
              if re.search(rx,data):
                if f.startswith(('tests/','evals/','skills/','website/','docs/')) or lf.endswith(('.example','.sample','.template','.md')):
                  fixtures[name]+=1
                else: real.append(f'{name} :: {f}')
          print('tracked files scanned:', len(files))
          print('fixture/doc hits (upstream tests+docs only):', dict(fixtures))
          print('credential-name templates (verified .env.example in audit 35238313808):', templates)
          if real:
            print('STOP REAL_SECRET_FOUND'); [print('REAL:', r[:80]) for r in real[:10]]; sys.exit(7)
          print('SCAN SAFE — no real credentials in final tree')
          PYEOF
          echo "VERIFY2_OK"
          REMOTE
      - name: Set remotes, push to canonical (no force), verify
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -euo pipefail
          gh codespace ssh --codespace "$NEW_CS" -- env PUSH_TOK="${GH_TOKEN}" bash -s <<'REMOTE' 2>&1
          set -euo pipefail
          mask(){ sed -E 's/(gh[pousr]_|github_pat_)[A-Za-z0-9_]+/[redacted-token]/g'; }
          cd /home/codespace/.hermes/hermes-agent
          g(){ git -c safe.directory='*' "$@"; }
          if g remote | grep -qx origin; then g remote rename origin upstream; fi
          g remote add origin https://github.com/VELORATRADEHQ/hermes-agent.git || g remote set-url origin https://github.com/VELORATRADEHQ/hermes-agent.git
          echo "--- remotes:"; g remote -v
          UURL=$(g remote get-url upstream 2>/dev/null || g remote get-url origin.upstream 2>/dev/null || echo MISSING)
          echo "$UURL" | grep -q 'github.com/NousResearch/hermes-agent.git' || { echo "STOP UPSTREAM_WRONG $UURL"; exit 8; }
          g remote get-url origin | grep -q 'github.com/VELORATRADEHQ/hermes-agent.git' || { echo "STOP ORIGIN_WRONG"; exit 9; }
          g config http.postBuffer 1073741824
          echo "--- pushing $(g rev-parse --short HEAD) to origin/main (no force)..."
          if ! g -c http.extraheader="Authorization: Bearer ${PUSH_TOK}" push origin main 2>&1 | mask; then
            echo "STOP PUSH_REJECTED"; exit 10
          fi
          sleep 5
          RSHA=$(g -c http.extraheader="Authorization: Bearer ${PUSH_TOK}" ls-remote origin refs/heads/main | awk '{print $1}')
          LSHA=$(g rev-parse HEAD)
          echo "local HEAD:  $LSHA"; echo "remote main: $RSHA"
          [ "$RSHA" = "$LSHA" ] || { echo "STOP LSREMOTE_MISMATCH"; exit 11; }
          g branch -u origin/main main 2>&1 | tail -1
          echo "PUSH_VERIFIED"
          REMOTE
      - name: Post-verify (imports, version, tree, gateway)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          cd /home/codespace/.hermes/hermes-agent
          venv/bin/python -c "import gateway, plugins.platforms.telegram.adapter, providers; print('IMPORT_OK')"
          grep -m1 '^version' pyproject.toml
          echo "--- status:"; git -c safe.directory='*' status --porcelain=v1
          echo "gateway still running: $(pgrep -fc 'hermes gateway' || echo 0)"
          echo "tracked .github files: $(git -c safe.directory='*' ls-files .github | wc -l)"
          echo "===== CANONICAL_MIGRATION=DONE ====="
          REMOTE
