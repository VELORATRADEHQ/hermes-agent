name: telegram-failure-diagnosis
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosis:
    name: READ-ONLY diagnosis of gemini-3.6-flash failure
    runs-on: ubuntu-latest
    env:
      CODESPACE_NAME: crispy-space-cod-jrqqwq797j6vcwqw
    steps:
      - name: Preconditions + state gate
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          state=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state)
          echo "codespace state: $state"
          [ "$state" = "Available" ] || { echo "::error::Not Available; NO start performed (policy)"; exit 1; }

      - name: Inspect gateway log (read-only) + one catalog GET
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"chat_id[\" ]*[:=][\" ]*[0-9]{5,}","chat_id=<id>",d)
          d=re.sub(r"chat/[0-9]{5,}","chat/<id>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -uo pipefail
          H="$HOME/.hermes"
          export PATH="$H/bin:$PATH"
          LOG=/tmp/hermes-gateway.log

          echo "===== G1) gateway state ====="
          [ -f "$LOG" ] && echo "log: $(wc -l < "$LOG") lines, mtime $(stat -c %y "$LOG" 2>/dev/null | cut -d. -f1)" || echo "log MISSING"
          pgrep -af "hermes" | grep -vi pgrep | grep -i gateway | head -3 | cut -c1-120 || echo "gateway process: NOT RUNNING"

          echo "===== G2) HTTP status/error lines (sanitized) ====="
          grep -inE "HTTP [0-9]{3}|status[ :=]+[0-9]{3}|429|404|401|403|500|502|503|Overloaded|ResourceExhausted|rate.?limit|quota|INVALID_ARGUMENT|NOT_FOUND|UNAVAILABLE|failed after retries|retry" "$LOG" 2>/dev/null | tail -40 | cut -c1-220

          echo "===== G3) all gemini-3.6-flash mentions ====="
          grep -in "gemini-3.6" "$LOG" 2>/dev/null | tail -25 | cut -c1-220

          echo "===== G4) model used per recent turn ====="
          grep -inE "model[ :=]|switch|/model|using model|provider[ :=]|Agent turn|incoming|update_id|sendMessage" "$LOG" 2>/dev/null | tail -50 | cut -c1-200

          echo "===== G5) single catalog GET (auth+catalog only, no completion) ====="
          K=$(grep '^GEMINI_API_KEY=' "$H/.env" 2>/dev/null | head -1 | cut -d= -f2-)
          if [ -z "$K" ]; then
            echo "GEMINI_API_KEY: not found in .env"
          else
            code=$(curl -s -o /tmp/cm.json -w "%{http_code}" --max-time 30 -H "x-goog-api-key: $K" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100")
            echo "GET models -> HTTP $code"
            python3 - <<'PY'
          import json
          try:
              ids=[m["name"].split("/",1)[1] for m in json.load(open("/tmp/cm.json"))["models"]]
              print("catalog size:", len(ids))
              print("'gemini-3.6-flash' in catalog:", "gemini-3.6-flash" in ids)
              print("gemini-3.x/flash family:", sorted(i for i in ids if "3.6" in i or "3.7" in i or "3.8" in i))
              print("'gemini-3-flash-preview' in catalog:", "gemini-3-flash-preview" in ids)
          except Exception as e:
              print("catalog parse fail:", e)
          PY
            rm -f /tmp/cm.json
          fi
          unset K

          echo "===== G6) config unchanged (read-only show) ====="
          echo "model.provider = $(hermes config get model.provider 2>/dev/null)"
          echo "model.default  = $(hermes config get model.default 2>/dev/null)"
          echo "===== DIAG_DONE ====="
          REMOTE
