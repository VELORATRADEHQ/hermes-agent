name: cp-inspect-3
on:
  workflow_dispatch:
jobs:
  inspect3:
    runs-on: ubuntu-latest
    steps:
      - name: Architecture inspection round 3 (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          gh codespace ssh --codespace "$NEW_CS" -- bash -s <<'REMOTE' 2>&1
          R=/home/codespace/.hermes/hermes-agent
          echo "===== A) provider CLI / files ====="
          find "$R/hermes_cli" -name '*.py' | sed "s|$R/||" | grep -E 'provider|model' || echo "no provider/model CLI files"
          grep -rnE "add_parser\('(provider|model|pairing)'" "$R/hermes_cli/" 2>/dev/null | head -8
          echo "===== B) providers/ package ====="
          grep -nE '^(class |def |PROVIDERS|REGISTRY)' "$R/providers/base.py" "$R/providers/__init__.py" 2>/dev/null | head -25
          echo "===== C) provider_registry / profiles ====="
          grep -nE '^(class |def )' "$R/agent/provider_registry.py" | head -20
          grep -rn 'profile' "$R/agent/provider_registry.py" | head -8
          echo "===== D) provider profiles test (structure hint) ====="
          grep -nE '(class |def test|profiles|provider:|base_url|api_key|models:)' "$R/tests/providers/test_provider_profiles.py" | head -25
          echo "===== E) config model: subtree (sanitized) ====="
          python3 - <<'PYEOF'
          import re
          t=open('/home/codespace/.hermes/config.yaml').read().splitlines()
          grab=False
          for l in t:
            if l.startswith('model:'): grab=True
            elif grab and re.match(r'^[a-zA-Z_]', l): break
            if grab: print(re.sub(r'(key|token|secret)(:\s*)\S+', r'\1\2[masked]', l))
          PYEOF
          echo "===== F) adapter callback/command wiring ====="
          grep -nE 'CallbackQuery|callback_query|InlineKeyboardButton|InlineKeyboardMarkup' "$R/plugins/platforms/telegram/adapter.py" | head -12
          echo "--- bot commands registration:"
          grep -nE 'BotCommand|setMyCommands|set_my_commands' "$R/plugins/platforms/telegram/adapter.py" | head -6
          echo "--- approval buttons origin:"
          grep -nE 'approval|_send_buttons|reply_markup' "$R/plugins/platforms/telegram/adapter.py" | head -10
          echo "===== G) pairing module API ====="
          grep -nE '^(class |def |    def )' "$R/gateway/pairing.py" | head -30
          echo "===== H) locales structure ====="
          ls "$R/locales/" 2>/dev/null | head -20
          find "$R/locales" -maxdepth 3 -type f | head -6
          echo "===== I) pairing CLI wiring ====="
          grep -rn "pairing approve\|'approve'" "$R/hermes_cli/"*.py 2>/dev/null | grep -i pair | head -5
          REMOTE
          echo "===== INSPECT3=DONE ====="
