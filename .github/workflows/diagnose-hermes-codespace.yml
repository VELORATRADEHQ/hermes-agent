name: lifecycle-sentinel-read
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    name: READ-ONLY lifecycle sentinel read
    runs-on: ubuntu-latest
    env:
      CODESPACE_NAME: crispy-space-cod-jrqqwq797j6vcwqw
    steps:
      - name: State gate
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::GH_TOKEN missing"; exit 1; }
          state=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state)
          echo "codespace state: $state"
          [ "$state" = "Available" ] || { echo "::error::Not Available"; exit 1; }

      - name: Read lifecycle sentinel + module (read-only)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"chat_id[\" ]*[:=][\" ]*[0-9]{5,}","chat_id=<id>",d)
          sys.stdout.write(d)'
          set -uo pipefail
          H="$HOME/.hermes"; SRC="$H/hermes-agent"

          echo "===== S1) sentinel path from installed source ====="
          sed -n '980,1010p' "$SRC/hermes_cli/gateway_windows.py" 2>/dev/null | cut -c1-190 | grep -nE "sentinel|path|json|return" | head -12
          grep -rn "get_lifecycle_sentinel_path\|SENTINEL" "$SRC/gateway/" 2>/dev/null | head -10 | sed "s|$SRC|<src>|" | cut -c1-170

          echo "===== S2) locate sentinel file on disk ====="
          find "$H" -maxdepth 3 \( -iname "*sentinel*" -o -iname "*lifecycle*" -o -iname "*ledger*" \) 2>/dev/null | head -10 | sed "s|$HOME|~|"

          echo "===== S3) dump sentinel/ledger content (sanitized) ====="
          for f in $(find "$H" -maxdepth 3 \( -iname "*sentinel*" -o -iname "*lifecycle*" \) -type f 2>/dev/null | head -4); do
            echo "--- ${f/#$HOME/~} ($(wc -c < "$f") bytes) ---"
            head -c 1500 "$f" | cut -c1-200 | head -30
            echo
          done

          echo "===== S4) read_prior_exit_label semantics ====="
          grep -n -B3 -A25 "def read_prior_exit_label" "$SRC/gateway/lifecycle_ledger.py" 2>/dev/null | head -45 | cut -c1-190

          echo "===== S5) what kills a gateway life per ledger (classifications) ====="
          grep -nE "UNCLEAN|SIGKILL|OOM|VM death|clean|exit_path" "$SRC/gateway/lifecycle_ledger.py" 2>/dev/null | head -12 | cut -c1-190

          echo "SENTINEL_DONE"
          REMOTE
