name: cpanel-deploy5
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull branch artifact, test, restart, health (no commits)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -euo pipefail
          gh codespace ssh --codespace "$NEW_CS" -- bash -s -- "$GH_TOKEN" <<'REMOTE' 2>&1
          set -euo pipefail
          TOKEN="$1"
          mask(){ sed -E 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[redacted-token]/g; s/AIza[0-9A-Za-z_-]{20,}/[redacted-gemini]/g; s/x-access-token:[^@"]+@/x-access-token:***@/g'; }
          R=/home/codespace/.hermes/hermes-agent
          PRE=a5ac6de3274da45877e668afb9eea2cba7172c37
          NEW=753837183dadf3d39f3e9f2bdb7f52443deb726f
          TIP=$(git -C "$R" rev-parse hermes-cpanel)
          git -C "$R" remote set-url origin "https://x-access-token:${TOKEN}@github.com/VELORATRADEHQ/hermes-agent.git"
          if [ "$TIP" = "$NEW" ]; then
            echo "ALREADY_AT_TARGET=$NEW (idempotent rerun)"
          elif [ "$TIP" = "$PRE" ]; then
            git -C "$R" pull --ff-only origin hermes-cpanel | mask
          else
            echo "ABORT: unexpected tip ($TIP) — neither $PRE nor $NEW — no changes made"; exit 2
          fi
          TIP2=$(git -C "$R" rev-parse hermes-cpanel)
          [ "$TIP2" = "$NEW" ] || { echo "ABORT: post-pull tip ($TIP2) != $NEW"; exit 3; }
          . "$R/.venv/bin/activate"
          export PYTHONPATH="$R"
          cd "$R"
          python3 -m py_compile gateway/cpanel.py && echo COMPILE_OK
          grep -n "cpanel/gateway/cpanel\|gateway/cpanel" gateway/cpanel.py >/dev/null || true
          python3 - <<'PY'
          import yaml, glob
          n=0
          for f in sorted(glob.glob("locales/*.yaml")):
              d=yaml.safe_load(open(f)) or {}
              cpd=d.get("cpanel") or {}
              for sec in ("persist","cust","cwx"):
                  assert sec in cpd, f"{f}: missing cpanel.{sec}"
              n+=1
          assert (yaml.safe_load(open("locales/fa.yaml"))["cpanel"]["persist"]["button"]) == "\U0001F39B پنل مدیریت"
          print("LOCALE_CHECK_OK", n, "locales")
          PY
          echo "=== SUITE: cpanel existing ==="
          pytest -q tests/gateway/test_cpanel.py 2>&1 | mask | tail -4
          echo "=== SUITE: cpanel t5 (persist+custom) ==="
          pytest -q tests/gateway/test_cpanel_t5.py 2>&1 | mask | tail -60
          echo "=== SUITE: native custom-provider persistence ==="
          pytest -q tests/tui_gateway/test_custom_provider_session_persistence.py tests/hermes_cli/test_model_provider_persistence.py 2>&1 | mask | tail -4
          echo "=== SUITE: native telegram auth + fail-closed + custom-provider runtime ==="
          pytest -q tests/gateway/test_telegram_auth_check.py tests/gateway/test_telegram_callback_auth_fail_closed.py tests/gateway/test_custom_provider_request_overrides.py 2>&1 | mask | tail -4
          echo "TEST_GATES=DONE"
          pkill -f 'hermes gateway' || true
          sleep 8
          UP=""
          for i in $(seq 1 180); do
            if pgrep -f 'hermes gateway' >/dev/null; then UP=1; break; fi
            sleep 5
          done
          [ -n "$UP" ] || { echo "FAIL: gateway did not come back within 15 minutes"; exit 4; }
          echo "GATEWAY_UP_AFTER=$(( i*5 ))s"
          pgrep -af 'hermes gateway' | mask
          # give telegram polling a moment, then require a FRESH heartbeat
          sleep 10
          HB=/home/codespace/.hermes/state/gateway.heartbeat
          AGE=$(( $(date +%s) - $(stat -c %Y "$HB") ))
          echo "heartbeat age: ${AGE}s"
          [ "$AGE" -le 90 ] || { echo "FAIL: stale heartbeat (${AGE}s)"; exit 5; }
          grep -a "Connected to Telegram\|polling" /home/codespace/.hermes/state/hermes-gateway.log | mask | tail -3
          echo "CHECK=DONE"
          REMOTE
          echo "PHASE1=OK"
