name: cpanel-deploy7
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull branch artifact, test, restart, health (no commits)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
          NEW_CS: hermes-migrated-240m-p7ppqpw9wgg7f964v
        run: |
          set -euo pipefail
          gh codespace ssh --codespace "$NEW_CS" -- bash -s -- "$GH_TOKEN" <<'REMOTE' 2>&1
          set -euo pipefail
          TOKEN="$1"
          mask(){ sed -E 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[redacted-token]/g; s/AIza[0-9A-Za-z_-]{20,}/[redacted-gemini]/g; s/x-access-token:[^@"]+@/x-access-token:***@/g'; }
          R=/home/codespace/.hermes/hermes-agent
          PRE=753837183dadf3d39f3e9f2bdb7f52443deb726f
          NEW=470371260038b3092eba03fbf96f80bdac58fdc5
          TIP=$(git -C "$R" rev-parse hermes-cpanel)
          git -C "$R" remote set-url origin "https://x-access-token:${TOKEN}@github.com/VELORATRADEHQ/hermes-agent.git"
          if [ "$TIP" = "$NEW" ]; then
            echo "ALREADY_AT_TARGET=$NEW (idempotent rerun)"
          elif [ "$TIP" = "$PRE" ]; then
            git -C "$R" pull --ff-only origin hermes-cpanel | mask
          else
            echo "ABORT: unexpected tip ($TIP) — neither $PRE nor $NEW — no changes made"; exit 2
          fi
          TIP2=$(git -C "$R" rev-parse hermes-cpanel)
          [ "$TIP2" = "$NEW" ] || { echo "ABORT: post-pull tip ($TIP2) != $NEW"; exit 3; }
          . "$R/.venv/bin/activate"
          export PYTHONPATH="$R"
          cd "$R"
          python3 -m py_compile gateway/cpanel.py && echo COMPILE_OK
          grep -n "cpanel/gateway/cpanel\|gateway/cpanel" gateway/cpanel.py >/dev/null || true
          python3 - <<'PY'
          import yaml, glob
          n=0
          for f in sorted(glob.glob("locales/*.yaml")):
              d=yaml.safe_load(open(f)) or {}
              cpd=d.get("cpanel") or {}
              for sec in ("persist","cust","cwx"):
                  assert sec in cpd, f"{f}: missing cpanel.{sec}"
              n+=1
          assert (yaml.safe_load(open("locales/fa.yaml"))["cpanel"]["persist"]["button"]) == "\U0001F39B پنل مدیریت"
          print("LOCALE_CHECK_OK", n, "locales")
          PY
          python3 - <<'PY'
          import yaml, glob
          def fl(node, prefix, out):
              if isinstance(node, dict):
                  for k,v in node.items():
                      fl(v, (prefix+"."+str(k)) if prefix else str(k), out)
              elif isinstance(node, str):
                  out[prefix]=node
          en_flat={}
          fl(yaml.safe_load(open("locales/en.yaml")) or {}, "", en_flat)
          keyset=set(en_flat)
          for f in sorted(glob.glob("locales/*.yaml")):
              d=yaml.safe_load(open(f)) or {}
              flat={}
              fl(d, "", flat)
              missing=keyset-set(flat); extra=set(flat)-keyset
              assert not missing and not extra, f"{f}: catalog parity broken (missing={sorted(missing)[:3]} extra={sorted(extra)[:3]})"
          assert yaml.safe_load(open("locales/fa.yaml"))["help"]["title"].startswith("📖")
          print("PARITY_CHECK_OK", len(glob.glob('locales/*.yaml')), "locales,", len(keyset), "keys")
          PY
          echo "=== SUITE: cpanel existing ==="
          pytest -q tests/gateway/test_cpanel.py 2>&1 | mask | tail -4
          echo "=== SUITE: cpanel t5 (persist+custom) ==="
          pytest -q tests/gateway/test_cpanel_t5.py 2>&1 | mask | tail -60
          echo "=== SUITE: cpanel t7 (probe-gated registration + capability UI) ==="
          pytest -q tests/gateway/test_cpanel_t7.py 2>&1 | mask | tail -15
          echo "=== SUITE: task-7 provider probe engine ==="
          pytest -q tests/gateway/test_provider_probe.py 2>&1 | mask | tail -6
          echo "=== SUITE: task-7 clean surface (menu filter + localized help) ==="
          pytest -q tests/gateway/test_help_surface.py 2>&1 | mask | tail -6
          echo "=== SUITE: task-7 provider unification (config + model picker) ==="
          pytest -q tests/hermes_cli/test_config_providers.py tests/hermes_cli/test_model_picker_task_only.py 2>&1 | mask | tail -6
          echo "=== SUITE: i18n catalog parity (all languages) ==="
          pytest -q tests/agent/test_i18n.py 2>&1 | mask | tail -6
          echo "=== SUITE: native custom-provider persistence ==="
          pytest -q tests/tui_gateway/test_custom_provider_session_persistence.py tests/hermes_cli/test_model_provider_persistence.py 2>&1 | mask | tail -4
          echo "=== SUITE: native telegram auth + fail-closed + custom-provider runtime ==="
          pytest -q tests/gateway/test_telegram_auth_check.py tests/gateway/test_telegram_callback_auth_fail_closed.py tests/gateway/test_custom_provider_request_overrides.py 2>&1 | mask | tail -4
          echo "TEST_GATES=DONE"
          # graceful stop, then deterministic start (native singleton lock protects
          # against the external ~15-min supervisor spawning a duplicate)
          pkill -f 'hermes gateway' || true
          for i in $(seq 1 24); do pgrep -f 'hermes gateway' >/dev/null || break; sleep 5; done
          if pgrep -f 'hermes gateway' >/dev/null; then pkill -9 -f 'hermes gateway' || true; sleep 3; fi
          cd "$R"
          setsid nohup "$R/venv/bin/python" "$R/hermes" gateway --accept-hooks run >> /home/codespace/.hermes/state/hermes-gateway.log 2>&1 < /dev/null &
          sleep 25
          pgrep -af 'hermes gateway' | mask
          pgrep -f 'hermes gateway' >/dev/null || { echo "FAIL: manual gateway start did not stay up"; tail -20 /home/codespace/.hermes/state/hermes-gateway.log | mask; exit 4; }
          # give telegram polling a moment, then require a FRESH heartbeat
          HB=/home/codespace/.hermes/state/gateway.heartbeat
          for i in $(seq 1 12); do
            sleep 10
            AGE=$(( $(date +%s) - $(stat -c %Y "$HB") ))
            [ "$AGE" -le 60 ] && break
          done
          AGE=$(( $(date +%s) - $(stat -c %Y "$HB") ))
          echo "heartbeat age: ${AGE}s"
          [ "$AGE" -le 90 ] || { echo "FAIL: stale heartbeat (${AGE}s)"; exit 5; }
          grep -a "Connected to Telegram\|polling" /home/codespace/.hermes/state/hermes-gateway.log | mask | tail -3
          echo "CHECK=DONE"
          REMOTE
          echo "PHASE1=OK"
