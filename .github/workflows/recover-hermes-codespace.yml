name: Recover Hermes Codespace (+ ensure gateway)

# External recovery mechanism for the Hermes test codespace.
# - Uses ONLY the official Codespaces lifecycle API (detect + start-when-stopped).
# - Lets the official idle timeout operate normally. No fake activity, ever.
# - Idempotent: repeated runs never create duplicate gateway processes.
# - Secret is referenced only via secrets.CODESPACE_LIFECYCLE_PAT and never printed.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions: {}

concurrency:
  group: recover-hermes-codespace
  cancel-in-progress: false

env:
  CODESPACE_NAME: "crispy-space-cod-jrqqwq797j6vcwqw"

jobs:
  recover:
    name: Detect -> recover -> ensure Hermes gateway
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify secret availability (value never printed)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CODESPACE_LIFECYCLE_PAT missing"
            exit 1
          fi
          echo "GH_TOKEN present"

      - name: Check Codespace state (official API)
        id: state
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          if ! gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state > cs_state.txt 2> cs_err.txt; then
            echo "::error::Codespaces API GET failed: $(head -c 200 cs_err.txt)"
            rm -f cs_state.txt cs_err.txt
            exit 1
          fi
          state=$(cat cs_state.txt); rm -f cs_state.txt cs_err.txt
          echo "initial state: ${state}"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Start stopped Codespace (official START; bounded)
        if: steps.state.outputs.state == 'Shutdown' || steps.state.outputs.state == 'Stopped'
        id: startcs
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -euo pipefail
          echo "state '${{ steps.state.outputs.state }}' -> requesting official START"
          gh api -X POST "/user/codespaces/${CODESPACE_NAME}/start" --jq .state
          echo "started=yes" >> "$GITHUB_OUTPUT"
          ok=0
          for i in $(seq 1 24); do
            sleep 10
            st=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state)
            echo "start poll $i: $st"
            if [ "$st" = "Available" ]; then ok=1; break; fi
            case "$st" in
              Unavailable|Deleted|Archived|Moved) echo "::error::fatal state '$st' during start"; exit 1;;
            esac
          done
          [ "$ok" = "1" ] || { echo "::error::not Available within 4 minutes of start"; exit 1; }
          echo "codespace became Available after start"

      - name: Wait through transitional states (bounded)
        if: contains(fromJSON('["Starting","Rebuilding","Updating","Updated","Queued","Provisioning","Awaiting","Created","Unknown"]'), steps.state.outputs.state)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          ok=0
          for i in $(seq 1 24); do
            sleep 10
            st=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state)
            echo "transition poll $i: $st"
            case "$st" in
              Available) ok=1; break;;
              Shutdown|Stopped) echo "::error::became stopped during transition wait"; exit 1;;
              Unavailable|Deleted|Archived|Moved) echo "::error::fatal state '$st'"; exit 1;;
            esac
          done
          [ "$ok" = "1" ] || { echo "::error::still transitioning after 4 minutes"; exit 1; }

      - name: Unexpected-state gate (fail clearly and safely)
        if: contains(fromJSON('["Unavailable","Deleted","Archived","Moved","Exporting"]'), steps.state.outputs.state)
        run: |
          echo "::error::unexpected Codespace state '${{ steps.state.outputs.state }}' — manual inspection required"
          exit 1

      - name: Verify Available before health check
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -euo pipefail
          st=$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq .state)
          echo "pre-health state: $st"
          [ "$st" = "Available" ] || { echo "::error::not Available before health check"; exit 1; }

      - name: Ensure Hermes Telegram gateway is running (idempotent)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_LIFECYCLE_PAT }}
        run: |
          set -uo pipefail
          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -s <<'REMOTE' 2>&1 | python3 -c '
          import sys,re
          d=sys.stdin.buffer.read().decode("utf-8","replace")
          d=re.sub(r"[0-9]{6,}:[A-Za-z0-9_-]{20,}","<tg-token>",d)
          d=re.sub(r"chat_id[\" ]*[:=][\" ]*[0-9]{5,}","chat_id=<id>",d)
          d=re.sub(r"(AQ\.|AIza|sk-)[A-Za-z0-9._-]{8,}","<redacted>",d)
          d=re.sub(r"(Bearer\s+)[A-Za-z0-9._-]{10,}",r"\1<redacted>",d)
          sys.stdout.write(d)'
          set -uo pipefail
          H="$HOME/.hermes"
          export PATH="$H/bin:$PATH"
          LOG="$H/state/hermes-gateway.log"
          mkdir -p "$H/state"

          # idempotency: a live gateway process means nothing to do
          if pgrep -af "hermes" | grep -i "gateway" | grep -vi pgrep >/dev/null 2>&1; then
            P=$(pgrep -f "hermes gateway" | head -1)
            echo "GATEWAY=ALREADY_RUNNING pid=$P"
            exit 0
          fi
          echo "GATEWAY=NOT_RUNNING -> launching existing install (no config/provider/model changes)"

          OFF=0; [ -f "$LOG" ] && OFF=$(wc -c < "$LOG")
          cd "$HOME"
          nohup hermes gateway --accept-hooks run >> "$LOG" 2>&1 &
          GPID=$!
          echo "spawned pid: $GPID (log: ~/.hermes/state/hermes-gateway.log, persistent)"
          sleep 3

          READY=0
          for i in $(seq 1 24); do
            if ! kill -0 "$GPID" 2>/dev/null; then echo "process died during boot"; READY=-1; break; fi
            if tail -c +$((OFF+1)) "$LOG" 2>/dev/null | grep -qiE "Connected to Telegram|polling mode"; then
              echo "readiness: Telegram connected at poll $i (~$((i*5))s)"; READY=1; break
            fi
            sleep 5
          done

          if [ "$READY" = "1" ]; then
            echo "GATEWAY=STARTED pid=$GPID"
          else
            echo "GATEWAY=START_FAILED"
            tail -15 "$LOG" 2>/dev/null | cut -c1-180
            kill "$GPID" 2>/dev/null
            echo "RESULT=GATEWAY_START_FAILED"
            exit 1
          fi
          REMOTE

      - name: Run summary
        if: always()
        env:
          INIT_STATE: ${{ steps.state.outputs.state }}
          STARTED: ${{ steps.startcs.outputs.started }}
        run: |
          echo "### Recovery summary"
          echo "- event: ${{ github.event_name }}"
          echo "- initial state: ${INIT_STATE:-unknown}"
          echo "- start requested: ${STARTED:-no}"
          echo "- job result: ${{ job.status }}"
